name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:   # bisa juga dijalankan manual dari tab Actions

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]   # test di 2 versi JDK sekaligus (matrix build)

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'          # caching otomatis untuk ~/.m2 berdasarkan pom.xml

      - name: Build & run unit test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload hasil test report
        if: always()             # tetap upload report walau test gagal, untuk debugging
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report-jdk${{ matrix.java-version }}
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload jar hasil build
        if: matrix.java-version == 17   # cukup upload jar sekali saja, tidak perlu tiap versi JDK
        uses: actions/upload-artifact@v4
        with:
          name: demo-calculator-jar
          path: target/demo-calculator.jar

  docker-build-push:
    needs: build-and-test          # hanya jalan kalau semua test di job sebelumnya lolos
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   # tidak perlu push image tiap ada PR, cukup saat push ke master
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/demo-calculator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/demo-calculator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max